<!DOCTYPE html>
<html lang="id" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="assets/icon/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="assets/icon/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="assets/icon/apple-touch-icon.png">
  <meta name="theme-color" content="#8fbbe3">
  <title>Gita's Daily Journal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Dancing+Script:wght@600;700&family=Lora:ital@0;1&display=swap" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
</head>
<body>

  <!-- ================= SAMPUL ================= -->
  <main id="cover" class="cover-screen">
    <button class="btn btn-soft btn-sm theme-btn cover-theme" title="Ganti tema">🌙</button>

    <div class="cover-book" id="coverBook">
      <svg class="cover-svg" viewBox="0 0 650 958" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Sampul Gita's Daily Journal">
        <defs>
          <pattern id="diamond" width="26" height="26" patternUnits="userSpaceOnUse">
            <rect width="26" height="26" class="sa"/><path d="M13 3 23 13 13 23 3 13Z" class="dm"/>
          </pattern>
          <pattern id="stripes" width="44" height="10" patternUnits="userSpaceOnUse">
            <rect width="22" height="10" class="sa"/><rect x="22" width="22" height="10" class="sb"/>
          </pattern>

          <g id="flower">
            <g class="fl">
              <ellipse cy="-15" rx="8" ry="14"/>
              <ellipse cy="-15" rx="8" ry="14" transform="rotate(72)"/>
              <ellipse cy="-15" rx="8" ry="14" transform="rotate(144)"/>
              <ellipse cy="-15" rx="8" ry="14" transform="rotate(216)"/>
              <ellipse cy="-15" rx="8" ry="14" transform="rotate(288)"/>
            </g>
            <circle r="6" class="cream stk" stroke-width="1.6"/>
          </g>
          <g id="leaf"><path d="M0 0C10-14 28-14 38 0 28 14 10 14 0 0Z" class="fl"/><path d="M4 0H32" class="stk" stroke-width="1"/></g>
          <g id="spark"><path d="M0-14 3-3 14 0 3 3 0 14-3 3-14 0-3-3Z" class="cream stk" stroke-width="1.4"/></g>

          <g id="corner">
            <path d="M0 0C46 0 78 14 96 50 74 36 48 34 34 46 24 56 28 70 42 70 54 70 58 58 50 52" class="stk" fill="none" stroke-width="3" stroke-linecap="round"/>
            <path d="M0 0C0 46 14 78 50 96 36 74 34 48 46 34 56 24 70 28 70 42 70 54 58 58 52 50" class="stk" fill="none" stroke-width="3" stroke-linecap="round"/>
            <use href="#flower" transform="translate(30 30) scale(.85)"/>
            <use href="#leaf" transform="translate(66 22) rotate(12) scale(.7)"/>
            <use href="#leaf" transform="translate(22 66) rotate(78) scale(.7)"/>
          </g>

          <path id="heart" d="M200 400C60 300 20 200 20 130 20 70 70 30 120 30 160 30 190 50 200 80 210 50 240 30 280 30 330 30 380 70 380 130 380 200 340 300 200 400Z"/>
        </defs>

        <!-- latar & bingkai -->
        <rect width="650" height="958" fill="url(#diamond)"/>
        <rect x="34" y="34" width="582" height="890" fill="url(#stripes)"/>
        <rect x="14" y="14" width="622" height="930" rx="10" fill="none" class="stk" stroke-width="5"/>
        <rect x="34" y="34" width="582" height="890" rx="4" fill="none" class="stk" stroke-width="2.5"/>
        <rect x="46" y="46" width="558" height="866" rx="2" fill="none" class="stk2" stroke-width="1.4" stroke-dasharray="2 7" stroke-linecap="round"/>

        <use href="#corner" transform="translate(40 40)"/>
        <use href="#corner" transform="translate(610 40) scale(-1 1)"/>
        <use href="#corner" transform="translate(40 918) scale(1 -1)"/>
        <use href="#corner" transform="translate(610 918) scale(-1 -1)"/>

        <!-- mahkota -->
        <g transform="translate(325 0)">
          <path d="M-46 205-54 150-27 178 0 132 27 178 54 150 46 205Z" class="cream stk" stroke-width="3" stroke-linejoin="round"/>
          <rect x="-46" y="205" width="92" height="12" rx="3" class="fl"/>
          <circle cx="-54" cy="146" r="6" class="cream stk" stroke-width="2"/>
          <circle cx="0" cy="127" r="7" class="cream stk" stroke-width="2"/>
          <circle cx="54" cy="146" r="6" class="cream stk" stroke-width="2"/>
          <path d="M0 196c-9-9-17 2-8 10l8 8 8-8c9-8 1-19-8-10z" class="gem"/>
          <path d="M0 217V258" class="stk" stroke-width="3"/>
          <circle cy="238" r="5" class="cream stk" stroke-width="2"/>
        </g>

        <!-- bingkai hati -->
        <g transform="translate(105 222) scale(1.1)">
          <use href="#heart" class="cream stk" stroke-width="9" stroke-linejoin="round"/>
          <use href="#heart" fill="none" class="stk2" stroke-width="2" stroke-dasharray="3 6" stroke-linecap="round" transform="translate(200 215) scale(.92) translate(-200 -215)"/>
        </g>
        <use href="#flower" transform="translate(150 292) scale(.7)"/>
        <use href="#flower" transform="translate(500 292) scale(.7)"/>
        <use href="#spark" transform="translate(120 470) scale(.8)"/>
        <use href="#spark" transform="translate(535 440) scale(.6)"/>

        <!-- judul -->
        <text x="325" y="392" text-anchor="middle" class="t-title" font-size="78">Gita's</text>
        <text x="325" y="458" text-anchor="middle" class="t-title" font-size="50">Daily Journal</text>
        <text x="325" y="508" text-anchor="middle" class="t-sub" font-size="25">"A home for all stories."</text>

        <!-- kupu-kupu & tangkai -->
        <g transform="translate(325 705) scale(1.15)">
          <g class="fl" stroke-width="2">
            <path d="M0 0C-40-52-96-46-88-6-84 24-44 30 0 6Z"/>
            <path d="M0 6C-34 20-66 46-50 66-34 82-10 52 0 6Z"/>
            <path d="M0 0C40-52 96-46 88-6 84 24 44 30 0 6Z"/>
            <path d="M0 6C34 20 66 46 50 66 34 82 10 52 0 6Z"/>
          </g>
          <path d="M-60-12C-48-26-30-24-24-12M60-12C48-26 30-24 24-12" class="stk2" fill="none" stroke-width="1.6"/>
          <path d="M0-4V52" class="stk" stroke-width="5" stroke-linecap="round"/>
          <path d="M0-4C-6-18-14-22-18-24M0-4C6-18 14-22 18-24" class="stk" fill="none" stroke-width="2" stroke-linecap="round"/>
          <path d="M-6 10c-6-6-12 1-6 6l6 6 6-6c6-5 0-12-6-6z" class="gem"/>
        </g>
        <path d="M325 770V812" class="stk" stroke-width="7" stroke-linecap="round"/>

        <!-- bunga-bunga bawah -->
        <use href="#leaf" transform="translate(240 760) rotate(-160) scale(1)"/>
        <use href="#leaf" transform="translate(410 760) rotate(-20) scale(1)"/>
        <use href="#leaf" transform="translate(236 800) rotate(160) scale(.9)"/>
        <use href="#leaf" transform="translate(414 800) rotate(20) scale(.9)"/>
        <use href="#flower" transform="translate(185 755) scale(1)"/>
        <use href="#flower" transform="translate(465 755) scale(1)"/>
        <use href="#flower" transform="translate(130 812) scale(.7)"/>
        <use href="#flower" transform="translate(520 812) scale(.7)"/>
        <use href="#spark" transform="translate(95 700) scale(.7)"/>
        <use href="#spark" transform="translate(555 690) scale(.8)"/>
      </svg>

      <button class="open-btn" id="openBtn">✨ Open Diary</button>
    </div>
  </main>

  <!-- ================= DIARY ================= -->
  <div id="app" class="container book-container py-3 d-none">

    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
      <h1 class="app-title m-0">🌸 Gita's Daily Journal</h1>
      <div class="d-flex flex-wrap gap-2">
        <button class="btn btn-soft btn-sm" id="closeBtn" title="Kembali ke sampul">📘 Close Diary</button>
        <button class="btn btn-soft btn-sm theme-btn" title="Ganti tema">🌙</button>
        <button class="btn btn-soft btn-sm" id="exp">⬇ Backup</button>
        <button class="btn btn-soft btn-sm" id="imp">⬆ Restore</button>
        <input type="file" id="file" accept=".json" hidden>
      </div>
    </div>

    <ul class="nav nav-pills nav-fill gap-2 mb-2 d-md-none" id="mobileTabs">
      <li class="nav-item"><button class="nav-link" data-view="list">📑 Journal list</button></li>
      <li class="nav-item"><button class="nav-link active" data-view="write">✍️ Write</button></li>
    </ul>

    <div class="book p-2 p-md-3">
      <div class="row g-0 spread" id="spread" data-view="write">

        <section class="col-md-6 page page-left" id="leftPage">
          <h2 class="hand text-center page-heading">Table of Contents</h2>
          <button class="btn btn-diary w-100 mb-2" id="baru">＋ New Page</button>
          <input class="form-control mb-3" id="cari" placeholder="Search page…">
          <div class="list-group list-group-flush" id="list"></div>
        </section>

        <section class="col-md-6 page page-right" id="rpage">
          <div class="ribbon"></div>

          <div class="row g-2 align-items-end mb-2">
            <div class="col-sm-5">
              <input type="date" class="form-control line-input" id="tgl">
            </div>
            <div class="col-sm-7">
              <input class="form-control line-input title-input" id="judul" placeholder="Today's Title…">
            </div>
          </div>

          <div class="moods mb-2" id="moods"></div>

          <textarea class="form-control line-input" id="isi" rows="10" placeholder="Dear diary…"></textarea>

          <div class="song-box mt-3">
            <label class="hand song-label" for="lagu">🎵 Today's Song</label>
            <input class="form-control line-input" id="lagu" placeholder="Paste YouTube link here">
            <div class="form-text" id="songmsg"></div>
            <div id="player" class="music d-none">
              <img id="cover-img" alt="" class="cover">
              <div class="flex-grow-1 min-w-0">
                <div id="songTitle" class="song-title text-truncate">Loading…</div>
                <input type="range" class="form-range" id="seek" min="0" max="100" value="0" step="0.1">
                <div class="d-flex justify-content-between small time-row">
                  <span id="tNow">0:00</span><span id="tAll">0:00</span>
                </div>
                <div class="d-flex align-items-center gap-2 mt-1">
                  <button type="button" class="btn btn-diary btn-sm px-3" id="playBtn" disabled>▶ Play</button>
                  <span title="Volume">🔊</span>
                  <input type="range" class="form-range vol" id="vol" min="0" max="100" value="80">
                </div>
              </div>
            </div>
            <div class="yt-hidden" aria-hidden="true"><div id="ytHolder"></div></div>
          </div>

          <div class="d-flex gap-2 mt-3">
            <button class="btn btn-diary" id="simpan">💾 Save</button>
            <button class="btn btn-outline-secondary" id="hapus">🗑 Delete</button>
          </div>
          <div class="form-text mt-2" id="status"></div>
        </section>

      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/script.js"></script>
</body>
</html>
